[project]
name = "ui-test-engineer"
version = "0.1.0"
description = "Examine a Target page and return a Playwright Test script that has been Run."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "playwright>=1.49",
  "openai>=1.50",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ui_test_engineer = ["static/*", "static/sample/*"]

[tool.mypy]
python_version = "3.11"
packages = ["ui_test_engineer"]
mypy_path = "src"
strict = true
