<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI test engineer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #6b6258;
      --line: #e4d9cc;
      --paper: #f6f1ea;
      --card: #fffdf9;
      --clay: #9a4e2c;
      --clay-soft: #f8ebe3;
      --ok: #1f6b45;
      --ok-soft: #e5f4eb;
      --bad: #8d2f2f;
      --bad-soft: #fbeaea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(640px 220px at 100% 0%, #f3e1d4 0%, transparent 60%),
        var(--paper);
      color: var(--ink);
      font: 16px/1.5 "Avenir Next", "Segoe UI", sans-serif;
    }
    .shell {
      width: min(820px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }
    header h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: -0.03em;
    }
    header p { margin: 8px 0 0; color: var(--muted); max-width: 40rem; }
    form {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }
    label {
      grid-column: 1 / -1;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      background: var(--clay);
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { margin: 16px 0 0; color: var(--muted); min-height: 1.5em; }
    .report {
      margin-top: 18px;
      display: grid;
      gap: 14px;
    }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
    }
    h2 { margin: 0 0 8px; font-size: 1rem; }
    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.85rem;
    }
    .pass { background: var(--ok-soft); color: var(--ok); }
    .fail { background: var(--bad-soft); color: var(--bad); }
    ul { margin: 0; padding-left: 18px; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .failure { color: var(--bad); }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>UI test engineer</h1>
      <p>Enter a Target page. The Examination writes a Playwright Test script, Runs it, and keeps every Attempt.</p>
    </header>
    <form id="examine">
      <label for="url">Target page</label>
      <input id="url" name="url" type="url" required placeholder="https://example.com" />
      <button type="submit">Examine</button>
    </form>
    <p id="status"></p>
    <section id="report" class="report" hidden></section>
  </main>
  <script>
    const form = document.querySelector("#examine");
    const urlInput = document.querySelector("#url");
    const status = document.querySelector("#status");
    const report = document.querySelector("#report");
    const submit = form.querySelector("button");
    urlInput.value = location.origin + "/sample/desk.html";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submit.disabled = true;
      status.textContent = "Examining the Target page…";
      report.hidden = true;
      report.replaceChildren();
      try {
        const response = await fetch("/examinations", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ url: urlInput.value }),
        });
        const body = await response.json();
        if (!response.ok) {
          status.textContent = body.detail || "The Examination could not start.";
          return;
        }
        status.textContent = "";
        render(body);
      } catch (error) {
        status.textContent = "The Examination could not start.";
      } finally {
        submit.disabled = false;
      }
    });

    function render(body) {
      report.hidden = false;
      const outcome = document.createElement("article");
      const pill = document.createElement("span");
      pill.className = "pill " + (body.passed ? "pass" : "fail");
      pill.textContent = body.passed ? "Passed" : "Failed";
      const heading = document.createElement("h2");
      heading.textContent = "Report";
      outcome.append(heading, pill);
      const picture = document.createElement("p");
      picture.textContent = "Picture captured (" + body.screenshot_bytes + " bytes).";
      outcome.append(picture);
      report.append(outcome);

      const controls = document.createElement("article");
      controls.innerHTML = "<h2>Controls</h2>";
      const list = document.createElement("ul");
      for (const control of body.controls) {
        const item = document.createElement("li");
        item.textContent = control.kind + ": " + control.name;
        list.append(item);
      }
      controls.append(list);
      report.append(controls);

      const attempts = document.createElement("article");
      attempts.innerHTML = "<h2>Attempts</h2>";
      body.attempts.forEach((attempt, index) => {
        const line = document.createElement("p");
        line.textContent = "Attempt " + (index + 1) + ": " + (attempt.passed ? "passed" : "failed");
        attempts.append(line);
        if (attempt.failure) {
          const failure = document.createElement("pre");
          failure.className = "failure";
          failure.textContent = attempt.failure;
          attempts.append(failure);
        }
      });
      report.append(attempts);

      const script = document.createElement("article");
      script.innerHTML = "<h2>Test script</h2>";
      const source = document.createElement("pre");
      source.textContent = body.script;
      script.append(source);
      report.append(script);
    }
  </script>
</body>
</html>
